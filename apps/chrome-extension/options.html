<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MathCanvas AI 연결</title>
    <style>
      :root {
        font-family:
          Pretendard, "Noto Sans KR", system-ui, -apple-system, sans-serif;
        color: #172033;
        background: #f2f6fc;
      }
      body {
        margin: 0;
        padding: 40px 20px;
      }
      main {
        width: min(620px, 100%);
        margin: 0 auto;
        padding: 32px;
        box-sizing: border-box;
        background: white;
        border: 1px solid #dce4f0;
        border-radius: 20px;
        box-shadow: 0 16px 40px rgb(28 54 92 / 10%);
      }
      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }
      p {
        line-height: 1.65;
      }
      label {
        display: block;
        margin-top: 24px;
        font-weight: 700;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        margin-top: 10px;
        padding: 14px 16px;
        border: 2px solid #aab8cc;
        border-radius: 12px;
        font: inherit;
      }
      input:focus {
        border-color: #3d6ee8;
        outline: 3px solid rgb(61 110 232 / 18%);
      }
      button {
        min-width: 160px;
        min-height: 48px;
        margin-top: 18px;
        padding: 0 22px;
        border: 0;
        border-radius: 12px;
        color: white;
        background: #315fd3;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      #status {
        min-height: 26px;
        margin-top: 16px;
        font-weight: 700;
      }
      ol {
        padding-left: 24px;
        line-height: 1.8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>MathCanvas AI 연결</h1>
      <p>처음 한 번만 연결 코드를 저장하면 됩니다.</p>
      <ol>
        <li>설치 안내에 나온 연결 코드를 복사하세요.</li>
        <li>아래 칸에 붙여 넣고 저장하세요.</li>
        <li>Chrome에서 MathCanvas에 로그인하세요.</li>
        <li>‘내 캔버스’ 화면을 열어 두세요.</li>
      </ol>
      <label for="pairingSecret">연결 코드</label>
      <input
        id="pairingSecret"
        type="password"
        autocomplete="off"
        minlength="64"
        maxlength="64"
        spellcheck="false"
      />
      <button id="saveButton" type="button">연결 코드 저장</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script type="module" src="/src/options.ts"></script>
  </body>
</html>
